name: Publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restaurar firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          test -n "$KEYSTORE"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Comprobar y compilar
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug -PciVersionCode="$(git rev-list --count HEAD)" -PciVersionName="1.0-${GITHUB_SHA:0:7}"
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Snail.apk
          tag="build-${GITHUB_SHA}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" Snail.apk --clobber
          else
            gh release create "$tag" Snail.apk --target "$GITHUB_SHA" --title "Snail ${GITHUB_SHA:0:7}" --notes "APK de Snail. Consulta README.md para conocer su funcionamiento." --latest
          fi
